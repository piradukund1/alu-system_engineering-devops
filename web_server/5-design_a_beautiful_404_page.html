<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f3ead8;
      font-family: Georgia, "Times New Roman", serif;
      color: #2b2b2b;
      overflow: hidden;
      text-align: center;
      padding: 2rem;
    }

    .frame {
      position: relative;
      background: #fbf6ea;
      padding: 3rem 4rem 2.5rem;
      border: 18px solid #6b4a2b;
      outline: 4px solid #c9a227;
      outline-offset: -26px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .25), inset 0 0 30px rgba(107, 74, 43, .15);
      max-width: 640px;
    }

    .code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: bold;
      letter-spacing: .05em;
      color: #3a2a1a;
      animation: float 4s ease-in-out infinite;
    }

    .code span {
      display: inline-block;
    }

    .code span:nth-child(2) {
      color: #c0392b;
      animation: spin 6s linear infinite;
    }

    .caption {
      font-style: italic;
      font-size: clamp(1.3rem, 4vw, 2rem);
      margin-top: .5rem;
    }

    .sub {
      margin-top: 1.2rem;
      font-size: 1rem;
      color: #6b5a45;
      line-height: 1.5;
    }

    .plaque {
      margin-top: 2rem;
      display: inline-block;
      background: #c9a227;
      color: #3a2a1a;
      padding: .4rem 1rem;
      font-size: .8rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
    }

    a.home {
      margin-top: 2rem;
      display: inline-block;
      color: #fbf6ea;
      background: #2b2b2b;
      text-decoration: none;
      padding: .8rem 1.6rem;
      border-radius: 2px;
      font-family: Arial, sans-serif;
      transition: transform .2s, background .2s;
    }

    a.home:hover {
      transform: translateY(-3px);
      background: #c0392b;
    }

    .cloud {
      position: absolute;
      width: 120px;
      height: 40px;
      background: #fff;
      border-radius: 40px;
      opacity: .8;
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud::before {
      width: 50px;
      height: 50px;
      top: -25px;
      left: 15px;
    }

    .cloud::after {
      width: 70px;
      height: 70px;
      top: -35px;
      right: 15px;
    }

    .c1 {
      top: 10%;
      animation-duration: 40s;
    }

    .c2 {
      top: 75%;
      animation-duration: 55s;
      animation-delay: -20s;
      transform: scale(.7);
    }

    .c3 {
      top: 40%;
      animation-duration: 70s;
      animation-delay: -35s;
      transform: scale(.5);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes drift {
      from {
        left: -200px;
      }

      to {
        left: 110vw;
      }
    }
  </style>
</head>

<body>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="frame">
    <div class="code"><span>4</span><span>0</span><span>4</span></div>
    <p class="caption">Ceci n'est pas une page</p>
    <p class="sub">Like Magritte's pipe, what you're looking at is only a picture of a page.<br>
      The real one has wandered off somewhere in the clouds.</p>
    <div class="plaque">La Trahison des URLs &mdash; 2026</div>
  </div>
  <a class="home" href="/">Take me back to the gallery</a>
</body>

</html>
